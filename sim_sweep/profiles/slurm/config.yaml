# Snakemake 8+ SLURM profile for the PRS-CSx-MT simulation sweep.
#
# Requires the SLURM executor plugin (once, in your snakemake env):
#     pip install snakemake-executor-plugin-slurm
#
# Usage (from inside sim_sweep/):
#     snakemake -s Snakefile --profile profiles/slurm
#
# EDIT BEFORE FIRST RUN: set slurm_partition (find yours with `sinfo -s`), and
# slurm_account only if your cluster requires one (many don't — delete that line
# if so). Per-replicate runtime/mem/cpus come from the Snakefile and override the
# fallbacks below; the account/partition here apply to every job.
#
# (Snakemake 7's generic `--cluster "sbatch ..."` mechanism was removed in v8;
#  that is why the old `cluster:` profile failed with "No rule to produce
#  --cluster=sbatch...". This profile uses the native SLURM executor instead.)

executor: slurm
jobs: 200                 # max jobs queued at once (throttles submission)

default-resources:
  - "slurm_partition='CHANGE_ME'"      # e.g. 'general' — or delete to use the cluster default
  - "slurm_account='CHANGE_ME'"        # delete this line if your cluster has no accounts
  - "runtime=180"                      # minutes (fallback; run_replicate sets its own)
  - "mem_mb=8000"
  - "cpus_per_task=1"

retries: 2                # retry a failed/timed-out job; the Snakefile escalates
                          # its runtime/mem on each attempt
latency-wait: 60          # tolerate shared-filesystem lag before declaring outputs missing
rerun-incomplete: true
keep-going: true          # a failed replicate doesn't halt the other 1469
printshellcmds: true
