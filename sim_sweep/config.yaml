# Configuration for the PRS-CSx-MT simulation sweep Snakefile.
# Override any value on the command line, e.g.:  snakemake --config n_replicates=5

# ── sweep grid ──────────────────────────────────────────────────────────────
n_replicates: 30        # seeds 1..n_replicates per scenario (matches the manual
                        # harness's generate_job_list.py N_REPLICATES)

# ── per-replicate simulation settings (mirror submit_jobs.sh) ────────────────
n_snp:    2000
# Chain length settled by the 2026-11-06 chain-length check (160 cluster tasks:
# 4 scenarios x 5 seeds x 2 methods x {1000, 5000, 10000, 20000} iterations).
# 1000/500 is biased low -- MT -0.008 at h2=0.1 (~4 se), EAS rgfrac
# -0.002..-0.005 for both methods -- while 5000/2000 lands within 0.003 of the
# 20000-iteration reference everywhere, and 10000 adds almost nothing. Applies
# to both methods, and to the prsxtra target, which reads the same two values.
# The header above is now only half true: submit_jobs.sh, the manual
# sbatch-array path, still hardcodes 1000/500.
n_iter:   5000          # was 1000
n_burnin: 2000          # was 500

# ── simulator fidelity ───────────────────────────────────────────────────────
# 'realistic' : each population gets its own LD; the LD reference handed to
#               PRS-CSx is a finite, shrunk sample-LD panel (n_ref individuals),
#               so it is MISMATCHED from the target as on real data; GWAS is
#               individual-level OLS; and a held-out test set (n_test people per
#               population) yields out-of-sample prediction accuracy (corr_pred).
# 'analytic'  : the original simulate_mt path (one shared exact LD used both to
#               generate data and as the reference; effect-recovery scoring only).
sim_mode:  realistic
n_ref:     500          # LD reference-panel individuals per population
n_test:    5000         # held-out test individuals per population
ld_hetero: 0.15         # per-population LD divergence (0 => identical LD across pops)

# ── sparsity prior `a` ────────────────────────────────────────────────────────
# `a` is the shape of the Gamma prior on the per-SNP variance psi_j; small `a`
# puts prior mass near zero, i.e. a sparser prior. It is a FIXED hyperparameter
# (no 'auto' path, unlike phi), and the simulation is 10% causal, so a=1 -- the
# PRS-CSx default -- is a mis-specified prior for BOTH methods. The 2026-11-06
# sparsity grids showed tuning it is worth ~2x more to PRS-CSx than to MT, so a=1
# flatters MT: see "The `a`=1 caveat" in PROJECT_NOTES.
#
#   "1"                 one value => no tuning, no tune/val split, scoring on the
#                       whole n_test cohort. Reproduces the untuned sweep exactly.
#   "1,0.25,0.05,0.01"  turns on validation tuning. Each (method, pop, trait)
#                       picks its own `a` on a tune_frac slice of the held-out
#                       cohort and every reported number is scored on the rest.
#                       Only the auto-phi arm is tuned (phi moves ~3 orders of
#                       magnitude across the grid), so the cost is (G+1)/2 = 2.5x,
#                       i.e. ~810 core-h for the 1470-replicate sweep.
# Do NOT extend below 0.01 without running the boundary check first (next-step 3,
# design point 4): the slope has collapsed by then and extra grid points only buy
# selection noise.
a_grid:    "1"
tune_frac: 0.5          # share of n_test used to select `a` (the rest scores it)
#
# NOTE when turning tuning on: the split halves the scoring cohort (5000 -> 2500),
# inflating every se by ~sqrt(2). Raise n_test to 10000 to hold precision; the
# genotypes are cheap next to the MCMC and data/ is deleted after each replicate.

# ── interpreter ──────────────────────────────────────────────────────────────
# Must have numpy + scipy + h5py. Locally that is /usr/bin/python3.12 (the
# default conda python3 lacks scipy). On the cluster, set this to the interpreter
# from your module/venv, e.g. after `module load python/3.11`.
python: "/mmfs1/home/jacks.local/frederick.boehm/.conda/envs/prscsx/bin/python"

# ── sibling method/baseline repos ────────────────────────────────────────────
# Leave blank to rely on the default sibling layout (PRScsx_mt/ and PRScsx/ next
# to this repo) or on PRSCSX_MT_DIR / PRSCSX_DIR already in the environment.
# Set them here to have the Snakefile export them into every job — robust on
# clusters that do not forward the submit-node environment to compute nodes.
prscsx_mt_dir: "/scratch/jacks.local/frederick.boehm/prscsx-mt-project/PRScsx_mt"       # e.g. /shared/project/PRScsx_mt
prscsx_dir:    "/scratch/jacks.local/frederick.boehm/prscsx-mt-project/PRScsx"       # e.g. /shared/project/PRScsx

# ── Slurm resource scaling ───────────────────────────────────────────────────
# Effective request = base + per_unit × (n_trait × n_pop), then × retry attempt.
# Sized from the 2026-11-06 pilot's MEASURED wall times at n_iter=5000 (49
# replicates, results_v2/*/seed_1/benchmark.tsv): mean 13.2 min, max 29.3 min,
# zero timeouts or retries -- about 1 + 2.8 x units minutes. The values below ask
# 35 min at 2 units, 55 at 4 (45 of the 49 scenarios), 75 at 6 and 115 at 10,
# i.e. ~4x the measured times, and the slurm profile doubles them on each retry.
# Total for the 1470-replicate sweep: ~324 core-hours.
# The pilot ran with 60/75, which asked 6.0 h for a 12-minute job; the 30/15
# before that came from a stale ~90 min estimate for 1000/500. Keeping the
# requests short also lets most jobs schedule on the quickq partition.
runtime_base_min:     15          # was 60 at the pilot, 30 before that
runtime_per_unit_min: 10          # was 75 at the pilot, 15 before that
# Memory measured on the 2026-11-06 pilot: peak max_rss was 0.8 GB across all 49
# scenarios (results_v2/*/seed_1/benchmark.tsv, column 3, in MB), so the former
# 4000/1000 pair over-requested by ~10x and would have slowed scheduling across
# 1470 jobs. These give 2.5 GB at 2 units up to 4.5 GB at 10 units, i.e. 3-5x
# the observed peak, and the profile doubles them on a retry. Note snakemake
# samples RSS periodically, so a very short spike could be missed.
mem_base_mb:          2000          # was 4000
mem_per_unit_mb:      250           # was 1000

# ── PRS-CSx-MT vs PRSxtra (target: snakemake ... prsxtra) ─────────────────────
prsxtra_groups:    [rg_frac_grid]   # scenario groups to run the comparison on
prsxtra_phi:       [auto]           # add 1e-2 for the fixed-phi arm
prsxtra_tune_frac: 0.5              # share of the n_test target people used to fit ridge weights

# ── optional path overrides (else derived from the Snakefile location) ───────
# scenarios_file: "scenarios.json"
# results_dir:    "results"
# prsxtra_results_dir: "results_prsxtra"
