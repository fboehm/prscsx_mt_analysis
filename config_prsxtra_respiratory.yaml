# config_prsxtra_respiratory.yaml
# PRS-CSx-MT vs PRSxtra in All of Us: He et al. (2026, Nat Genet) lung
# diseases and traits.
#
# Stage A:  snakemake -s Snakefile_prsxtra --configfile config_prsxtra_respiratory.yaml --cores 8
# Stage B:  aou/README.md
#
# Raw GWAS files: python scripts/download_respiratory_gwas.py fetches all of
# them (sources and accessions in that script's header and below).
#
# Before using any GWAS, confirm it does not include All of Us participants;
# the evaluation assumes All of Us is independent of discovery.
#
# Checked 2026-10-07: no GWAS below includes All of Us as a cohort.
#   asthma, copd     GBMI: 18 biobanks (CKB, GS, Lifelines, QSKIN, GNH, HUNT,
#                    UCLA, CCPM, MGB, BioVU, BioMe, MGI, BBJ, ESTBB, deCODE,
#                    FinnGen, TWB, UKBB); Tsuo et al. 2022 Methods (PMC9903683)
#   fev1/fvc/ratio   EUR Shrine 2023, 31 cohorts (UKB, ARIC, CHS, FHS, MESA,
#                    HUNT, QBB, ...); AFR/AMR UKB only; EAS KCPS-II + TWB
#                    (GWAS Catalog cohort field)
#   lung_cancer      EUR/AFR/AMR MVP only; EAS BBJ (GWAS Catalog cohort field)
#   smoking, cpd     GSCAN 2022, 60 cohorts (UKB, HUNT, deCODE, GERA, HRS, WHI,
#                    eMERGE, PAGE, BBJ, ~28 TOPMed studies, ...; 23andMe removed);
#                    "All of Us" absent from full text, Suppl. Table 1 and
#                    supplementary PDFs (PMC9771818)
# Residual: individuals may be enrolled in both All of Us and a US discovery
# cohort (GBMI's BioVU/BioMe/MGB/MGI/UCLA/CCPM, MVP, US cohorts in GSCAN and
# Shrine). Not quantifiable without IDs; expected to be a small fraction of
# All of Us. Note as a limitation. Non-US cohorts cannot overlap.

analysis_name: respiratory

ref_dir:  "data/ld_ref"
ref_type: "1kg"
bim_prefix: "data/ld_ref/hm3_proxy"     # replace with aou_hm3_matched, see lipids config
liftover_chain_url: "https://hgdownload.soe.ucsc.edu/goldenPath/hg19/liftOver/hg19ToHg38.over.chain.gz"

prscsx_dir:    "../PRScsx"
prscsx_mt_dir: "../PRScsx_mt"
python: "python3"

populations: ["EUR", "EAS", "AFR", "AMR"]
traits: ["asthma", "copd", "lung_cancer", "fev1", "fvc", "fev1_fvc", "smoking", "cpd"]

# One entry per trait. `defaults` applies to every population file of the trait
# and can be overridden per population under `files`.
#
#   path      raw file (plain or .gz)
#   n         number | "auto" (median per-SNP N, from cols.n or from
#             cols.n_case + cols.n_ctrl as 4 / (1/cases + 1/controls))
#             | {cases: .., controls: ..}
#   match_by  rsid | position   (position needs chr/pos columns and `build`)
#   build     37 | 38           (only used with match_by: position)
#   cols      column names in the raw file. Effect: `beta`, `or` (converted to
#             log OR), `log_or`, or `z` alone. Precision: `se` or `p`.
sumstats:
  # GBMI ancestry-specific meta-analyses (GRCh38; effect allele = ALT)
  asthma:
    defaults:
      match_by: position
      build: 38
      n: auto
      cols: {chr: "#CHR", pos: POS, a1: ALT, a2: REF, beta: inv_var_meta_beta, se: inv_var_meta_sebeta,
              n_case: N_case, n_ctrl: N_ctrl}
    files:
      EUR: {path: data/sumstats/raw/respiratory/asthma_EUR.txt.gz}
      EAS: {path: data/sumstats/raw/respiratory/asthma_EAS.txt.gz}
      AFR: {path: data/sumstats/raw/respiratory/asthma_AFR.txt.gz}
      AMR: {path: data/sumstats/raw/respiratory/asthma_AMR.txt.gz}
  copd:
    defaults:
      match_by: position
      build: 38
      n: auto
      cols: {chr: "#CHR", pos: POS, a1: ALT, a2: REF, beta: inv_var_meta_beta, se: inv_var_meta_sebeta,
              n_case: N_case, n_ctrl: N_ctrl}
    files:
      EUR: {path: data/sumstats/raw/respiratory/copd_EUR.txt.gz}
      EAS: {path: data/sumstats/raw/respiratory/copd_EAS.txt.gz}
      AFR: {path: data/sumstats/raw/respiratory/copd_AFR.txt.gz}
      AMR: {path: data/sumstats/raw/respiratory/copd_AMR.txt.gz}
  # Ancestry-specific lung cancer GWAS (all public; see download script):
  # EUR/AFR/AMR: Million Veteran Program, PheCode 165.1 (GRCh38; OR + p)
  # EAS: Biobank Japan (GRCh37; no rsIDs; beta + SE)
  # He et al. used Byun et al. 2022's single cross-ancestry meta-analysis for
  # EUR, EAS and AFR; that would count the same participants once per ancestry.
  lung_cancer:
    defaults:
      match_by: rsid
      n: auto
      cols: {snp: rsid, a1: effect_allele, a2: other_allele, or: odds_ratio, p: p_value,
              n_case: num_cases, n_ctrl: num_controls}
    files:
      EUR: {path: data/sumstats/raw/respiratory/lung_cancer_EUR.txt.gz}
      AFR: {path: data/sumstats/raw/respiratory/lung_cancer_AFR.txt.gz}
      AMR: {path: data/sumstats/raw/respiratory/lung_cancer_AMR.txt.gz}
      EAS: {path: data/sumstats/raw/respiratory/lung_cancer_EAS.txt.gz, match_by: position, build: 37,
             n: {cases: 4444, controls: 174282},
             cols: {snp: null, chr: chromosome, pos: base_pair_location, or: null, p: null,
                    beta: beta, se: standard_error, n_case: null, n_ctrl: null}}
  # FEV1
  # EAS: He et al. 2026 (GCST90705067; GRCh37, no rsIDs, N = 129,680)
  # EUR: Shrine et al. 2023 (GCST90292609; all cohorts incl. UKB, z-scores only)
  # AFR / AMR: Shrine et al. 2023 UK Biobank analyses (GCST90292621 / GCST90292633)
  fev1:
    defaults:
      match_by: rsid
      n: auto
      cols: {snp: variant_id, a1: effect_allele, a2: other_allele, beta: beta, se: se, n: N}
    files:
      EUR: {path: data/sumstats/raw/respiratory/fev1_EUR.txt.gz, cols: {beta: null, se: null, z: Zscore}}
      EAS: {path: data/sumstats/raw/respiratory/fev1_EAS.txt.gz, match_by: position, build: 37, n: 129680,
             cols: {snp: null, chr: chromosome, pos: base_pair_location, se: standard_error, n: null}}
      AFR: {path: data/sumstats/raw/respiratory/fev1_AFR.txt.gz}
      AMR: {path: data/sumstats/raw/respiratory/fev1_AMR.txt.gz}
  # FVC
  # EAS: He et al. 2026 (GCST90705068; GRCh37, no rsIDs, N = 129,680)
  # EUR: Shrine et al. 2023 (GCST90292610; all cohorts incl. UKB, z-scores only)
  # AFR / AMR: Shrine et al. 2023 UK Biobank analyses (GCST90292622 / GCST90292634)
  fvc:
    defaults:
      match_by: rsid
      n: auto
      cols: {snp: variant_id, a1: effect_allele, a2: other_allele, beta: beta, se: se, n: N}
    files:
      EUR: {path: data/sumstats/raw/respiratory/fvc_EUR.txt.gz, cols: {beta: null, se: null, z: Zscore}}
      EAS: {path: data/sumstats/raw/respiratory/fvc_EAS.txt.gz, match_by: position, build: 37, n: 129680,
             cols: {snp: null, chr: chromosome, pos: base_pair_location, se: standard_error, n: null}}
      AFR: {path: data/sumstats/raw/respiratory/fvc_AFR.txt.gz}
      AMR: {path: data/sumstats/raw/respiratory/fvc_AMR.txt.gz}
  # FEV1/FVC
  # EAS: He et al. 2026 (GCST90705069; GRCh37, no rsIDs, N = 129,680)
  # EUR: Shrine et al. 2023 (GCST90292611; all cohorts incl. UKB, z-scores only)
  # AFR / AMR: Shrine et al. 2023 UK Biobank analyses (GCST90292623 / GCST90292635)
  fev1_fvc:
    defaults:
      match_by: rsid
      n: auto
      cols: {snp: variant_id, a1: effect_allele, a2: other_allele, beta: beta, se: se, n: N}
    files:
      EUR: {path: data/sumstats/raw/respiratory/fev1_fvc_EUR.txt.gz, cols: {beta: null, se: null, z: Zscore}}
      EAS: {path: data/sumstats/raw/respiratory/fev1_fvc_EAS.txt.gz, match_by: position, build: 37, n: 129680,
             cols: {snp: null, chr: chromosome, pos: base_pair_location, se: standard_error, n: null}}
      AFR: {path: data/sumstats/raw/respiratory/fev1_fvc_AFR.txt.gz}
      AMR: {path: data/sumstats/raw/respiratory/fev1_fvc_AMR.txt.gz}
  # GSCAN 2022 ancestry-stratified, 23andMe removed (GRCh38; rsIDs)
  smoking:
    defaults:
      match_by: rsid
      n: auto
      cols: {snp: RSID, a1: EFFECT_ALLELE, a2: OTHER_ALLELE, beta: BETA, se: SE, n: N}
    files:
      EUR: {path: data/sumstats/raw/respiratory/smoking_EUR.txt.gz}
      EAS: {path: data/sumstats/raw/respiratory/smoking_EAS.txt.gz}
      AFR: {path: data/sumstats/raw/respiratory/smoking_AFR.txt.gz}
      AMR: {path: data/sumstats/raw/respiratory/smoking_AMR.txt.gz}
  # GSCAN 2022 ancestry-stratified, 23andMe removed (GRCh38; rsIDs)
  cpd:
    defaults:
      match_by: rsid
      n: auto
      cols: {snp: RSID, a1: EFFECT_ALLELE, a2: OTHER_ALLELE, beta: BETA, se: SE, n: N}
    files:
      EUR: {path: data/sumstats/raw/respiratory/cpd_EUR.txt.gz}
      EAS: {path: data/sumstats/raw/respiratory/cpd_EAS.txt.gz}
      AFR: {path: data/sumstats/raw/respiratory/cpd_AFR.txt.gz}
      AMR: {path: data/sumstats/raw/respiratory/cpd_AMR.txt.gz}

fit:
  phi: auto
  n_iter:   null
  n_burnin: null
  thin: 5
  seed: 2026
  meta: true         # also a cross-ancestry META score per trait (He et al.'s candidates)
  chromosomes: null
  prscsx_mt:
    cross_trait: mult
    rho_pheno: null
    n_overlap: null

mtag:
  python: "python2.7"
  dir: "tools/mtag"
  min_mean_chi2: 1.02
  ld_ref_panel:
    EUR: "tools/mtag/ld_ref_panel/eur_w_ld_chr/"
    EAS: "data/ldscores/eas_w_ld_chr/"
    AFR: "data/ldscores/afr_w_ld_chr/"
    AMR: "data/ldscores/amr_w_ld_chr/"

sumstats_raw_dir: "data/sumstats/raw/respiratory"
sumstats_fmt_dir: "data/sumstats/formatted/respiratory"
out_dir:          "results/prsxtra_aou/respiratory"

# He et al. evaluated the three diseases in All of Us; the lung-function and
# smoking traits enter only as candidate scores.
aou:
  outcomes:
    asthma:      {type: binary, matched_trait: asthma}
    copd:        {type: binary, matched_trait: copd}
    lung_cancer: {type: binary, matched_trait: lung_cancer}
  covariates: [age, sex, PC1, PC2, PC3, PC4, PC5, PC6, PC7, PC8, PC9, PC10]
  tune_frac: 0.7
  n_splits: 1
  n_boot: 1000
  min_group_n: 200
  min_group_cases: 50
  seed: 2026
