# Snakemake workflow configuration for PRS-CSx vs PRS-CSx-MT comparison

# Experimental grid
n_eur: [10000, 50000, 100000]
n_eas: [1000, 5000, 10000]
rg: [0.0, 0.3, 0.5, 0.8]
seeds: [1, 2, 3, 4, 5]

# Simulation mode
# "analytical"  – summary stats computed analytically (fast, default)
# "indiv_gwas"  – individual-level OLS GWAS per SNP (mirrors AoU HM3 workflow)
sim_mode: "indiv_gwas"

# Simulation settings
n_snp: 500
n_causal: 50
n_pop: 2
n_trait: 2
block_size: 50
ld_decay: 0.5
rho_pop: 0.8
h2: [0.5, 0.5]
pop: ["EUR", "EAS"]
chrom: 1

# MCMC settings
a: 1
b: 0.5
n_iter: 1000
n_burnin: 500
thin: 5

# Paths — PRScsx_mt is a sibling repo of this analysis repo (see README).
prscsx_mt_dir: "../PRScsx_mt"
